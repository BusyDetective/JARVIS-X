    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:      #080f1a;
            --surface: #0d1829;
            --border:  #1a2d4a;
            --green:   #00ff88;
            --blue:    #38bdf8;
            --red:     #ff4d6d;
            --amber:   #fbbf24;
            --text:    #c8d8e8;
            --muted:   #4a6080;
            --mono:    'JetBrains Mono', monospace;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--mono);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Nav ── */
        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            flex-shrink: 0;
            z-index: 100;
        }

        .nav-logo { font-size: 13px; color: var(--green); letter-spacing: 0.08em; }
        .nav-logo span { color: var(--muted); }
        .nav-title { font-size: 12px; color: var(--muted); }

        .nav-links { display: flex; gap: 20px; }
        .nav-links a {
            font-size: 11px;
            color: var(--muted);
            text-decoration: none;
            letter-spacing: 0.05em;
            transition: color 0.2s;
        }
        .nav-links a:hover { color: var(--green); }

        /* ── Graph container ── */
        #graph-wrap {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #network {
            width: 100%;
            height: 100%;
            background: var(--bg);
        }

        /* ── Legend ── */
        .legend {
            position: absolute;
            top: 16px;
            right: 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 14px 16px;
            font-size: 11px;
            color: var(--text);
            z-index: 50;
            min-width: 160px;
        }

        .legend-title {
            font-size: 10px;
            color: var(--muted);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            font-size: 11px;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* ── Stats bar ── */
        .stats-bar {
            position: absolute;
            bottom: 16px;
            left: 16px;
            display: flex;
            gap: 16px;
            z-index: 50;
        }

        .stat-pill {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 6px 12px;
            font-size: 11px;
            color: var(--muted);
        }

        .stat-pill span { color: var(--text); font-weight: 600; }

        /* ── Loading bar ── */
        #loadingBar {
            position: absolute;
            inset: 0;
            background: rgba(8,15,26,0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            transition: opacity 0.5s;
        }

        .loading-label {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 12px;
            letter-spacing: 0.1em;
        }

        .loading-track {
            width: 300px;
            height: 3px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
        }

        .loading-fill {
            height: 100%;
            background: var(--green);
            border-radius: 2px;
            width: 0%;
            transition: width 0.3s;
            box-shadow: 0 0 8px rgba(0,255,136,0.5);
        }

        #loadingPct {
            font-size: 11px;
            color: var(--muted);
            margin-top: 8px;
        }

        /* ── vis.js config panel dark override ── */
        .vis-configuration-wrapper {
            display: none !important;
        }
    </style>
</head>
